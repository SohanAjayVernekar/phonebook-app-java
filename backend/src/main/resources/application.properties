spring.application.name=phonebook-backend
server.port=8000
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/phonebook}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-please-use-a-long-random-value}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
