server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-java:5432/phonebook}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-please-use-a-long-random-value}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
