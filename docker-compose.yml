services:
  postgres-java:
    image: postgres:16-alpine
    container_name: phonebook-java-postgres
    environment:
      POSTGRES_DB: phonebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_java_data:/var/lib/postgresql/data
    restart: unless-stopped

  java-backend:
    build: ./backend-java
    container_name: phonebook-java-backend
    environment:
      DB_URL: jdbc:postgresql://postgres-java:5432/phonebook
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-key-in-production-please-use-a-long-random-value
      JWT_EXPIRATION_MINUTES: 60
    depends_on:
      - postgres-java
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: phonebook-java-frontend
    ports:
      - "8082:80"
    depends_on:
      - java-backend
    restart: unless-stopped

volumes:
  postgres_java_data:
